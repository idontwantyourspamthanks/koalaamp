name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Real 3-platform build (FE-0). Pinned runner images — floating "latest"
  # tags are avoided (a silent toolchain bump is a surprise change; upgrades
  # are deliberate commits). Qt is pinned per platform: 6.12.0 where published,
  # and 6.10.3 on Windows because the 6.11/6.12 Windows packages are not yet
  # installable by aqt (repo layout change). Recorded in docs/spikes/fe0-deps.md.
  build:
    name: build (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: linux-gcc
            qt_version: '6.12.0'
          - runner: windows-2022
            preset: windows-msvc
            qt_version: '6.10.3'
          - runner: macos-14
            preset: macos-clang
            qt_version: '6.12.0'
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt ${{ matrix.qt_version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          cache: true

      - name: Enable ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.preset }}

      # Native deps for the M0 spike targets, per platform (fe0-deps.md table).
      # Linux: libvlc-dev (FE-2 callback path) + vendored headers via the script.
      # libcurl: distro (Linux) / brew (macOS) / vcpkg (Windows).
      - name: Vendor header-only deps
        run: bash scripts/vendor-deps.sh

      # vlc-plugin-base is REQUIRED alongside libvlc-dev: the -dev package
      # ships headers + libvlccore but NO codec/aout plugins, so libvlc loads
      # with zero decoders and every PCM-flow test times out (discovered when
      # PlaybackCore tests failed 8.0s-flat on CI while passing locally —
      # the dev box has the full vlc package). Contains wav/mp3/FLAC/OGG
      # decoders and the amem (callback) audio output module itself.
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev vlc-plugin-base libcurl4-openssl-dev libtag1-dev libsqlite3-dev

      - name: Install libcurl (macOS)
        if: runner.os == 'macOS'
        run: brew install curl taglib

      - name: Install libcurl + zlib (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          vcpkg install curl:x64-windows zlib:x64-windows taglib:x64-windows sqlite3:x64-windows
          echo "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          # vcpkg dynamic triplet: runtime DLLs (zlib1.dll, libcurl.dll) live in
          # installed/x64-windows/bin; put them on PATH for build-time test
          # discovery (CatchAddTests executes the test exes) and for ctest.
          echo "PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH" >> $env:GITHUB_ENV

      # Our own vendored shared libraries need the same treatment on Windows:
      # libprojectM-4.dll is installed into third_party/projectm/bin, which is
      # neither on PATH nor reachable by RPATH (Windows has none). Without it a
      # test exe that links the VZ-1 facade fails to start with 0xc0000135.
      - name: Vendored native DLLs on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "PATH=$env:GITHUB_WORKSPACE/third_party/projectm/bin;$env:PATH" >> $env:GITHUB_ENV

      # Qt widget tests must not pick a real platform plugin on headless
      # runners: export offscreen at the JOB level so both Catch2's build-time
      # discovery (PRE_TEST still shells out to the exe) and every ctest run
      # inherit it, independent of per-test ENVIRONMENT quirks.
      - name: Headless Qt platform
        run: echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      # Catch2 discovers tests by executing them during the build. On Windows a
      # vcpkg DLL (libcurl/zlib/tag) next to the build outputs is not on the
      # loader path unless it is beside the exe; stage them before Build runs.
      - name: Stage vcpkg runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = @(
            "build/windows-msvc/Release",
            "build/windows-msvc/tests/Release",
            "build/windows-msvc/src/Release",
            "build/windows-msvc/src/servers/jellyfin/Release"
          )
          $sources = @(
            "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll"
          )
          foreach ($dir in $dirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            foreach ($source in $sources) {
              if (Test-Path $source) {
                Copy-Item $source $dir -Force
              }
            }
          }
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Windows runtime diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Staged DLLs:"
          Get-ChildItem "build/windows-msvc/tests/Release" -Filter *.dll |
            Select-Object -ExpandProperty Name
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Select-Object -First 1 -ExpandProperty FullName
          & $dumpbin /dependents "build/windows-msvc/tests/Release/jellyfin_remote_tests.exe"

      - name: Test (ctest)
        run: ctest --preset ${{ matrix.preset }}

      # Non-blocking style check (ticket: format check is a warning, not a gate).
      - name: clang-format check (non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          python3 -m pip install --user 'clang-format==18.1.8'
          CF="$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts", "posix_user"))')/clang-format"
          files=$(git ls-files '*.cpp' '*.hpp' '*.h')
          [ -z "$files" ] || "$CF" --dry-run --Werror $files

  # NOTE: branch protection on `master` requires these two status checks by
  # exact job name. Keep the `name:` values byte-identical; if they must
  # change, re-sync protection in the same change (see the coupling note in
  # docs/tickets/FE-0-bootstrap.md).
  license-audit:
    name: license audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run scripts/license-audit.sh (GPL/AGPL denied, LGPL allowed)
        run: bash scripts/license-audit.sh

  vendor-deps:
    name: vendor-deps idempotency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # vendor-deps.sh also fetches + builds libprojectM (shared, LGPL) from
      # pinned source; it needs cmake/ninja and OpenGL dev headers.
      - name: Native build deps (libprojectM)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev
      - name: Fresh install, re-run no-op, --check
        run: |
          # FE-2: the script now also verifies the native libvlc dev package.
          sudo apt-get update && sudo apt-get install -y libvlc-dev
          bash scripts/vendor-deps.sh
          bash scripts/vendor-deps.sh --check
          bash scripts/license-audit.sh

  secrets-scan:
    name: secrets scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Cheap pattern scan
        run: |
          # Lightweight guard; swap for gitleaks action when code lands.
          ! grep -rniE "(api[_-]?key|secret|password|token)\s*[:=]\s*['\"][A-Za-z0-9+/]{16,}" \
              --include="*.md" --include="*.yml" --include="*.json" \
              . 2>/dev/null | grep -v "research/\|test/fixtures/"
