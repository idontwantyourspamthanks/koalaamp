# SPDX-License-Identifier: MIT
#
# nightly-soak — VZ-1 task 8: hold every preset of a pinned 500-preset slice for ten
# seconds each and keep the log.
#
# It is deliberately not part of CI: it needs a GL-capable headless runner, a large
# fetched corpus and hours, so it runs nightly (and on demand).
#
# The corpus is community-authored and fetched at a pinned commit, never committed
# (AGENTS.md) — the same rule as the skin corpora.
name: nightly soak

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preset-soak:
    name: preset soak (500 presets)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6.12.0
        uses: jurplel/install-qt-action@v4
        with:
          # Kept in lockstep with ci.yml's linux-gcc preset on purpose: a divergent
          # Qt between CI and the soak makes a soak failure unattributable.
          version: '6.12.0'
          cache: true

      # The same native deps ci.yml installs on Linux, plus xvfb: the configure
      # step needs libcurl (servers), libvlc-dev + vlc-plugin-base (the playback
      # seam), GL for the visualizer's canvas, and xvfb because the runner is
      # headless. Missing any of these fails Configure rather than the soak.
      - name: Native deps (same set as ci.yml, plus xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev xvfb \
            libcurl4-openssl-dev libvlc-dev vlc-plugin-base

      - name: Vendor header-only deps
        run: bash scripts/vendor-deps.sh

      - name: Fetch the pinned preset slice
        run: bash scripts/fetch-presets.sh 500

      - name: Configure
        run: cmake --preset linux-gcc

      - name: Build
        run: cmake --build --preset linux-gcc

      # Deliberately skinless: the visualizer falls back to its designed frame, so
      # this job needs no skin fixture and stays independent of the skin corpora.
      # Do not "fix" it by adding one.
      #
      # Ten seconds a preset. A preset that renders no frames during its hold is
      # the hang this job exists to catch, and the app exits 2 for it; a crash
      # kills the process, failing the step with the log showing what ran last.
      - name: Soak
        run: |
          set -o pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            env QT_QPA_PLATFORM=xcb \
            ./build/linux-gcc/src/koalaamp \
              --soak-presets third_party/presets/soak \
              --soak-hold-ms 10000 \
              --null-audio | tee soak.log

      - name: Upload the soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preset-soak-log
          path: soak.log
          if-no-files-found: warn
